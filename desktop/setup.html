<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
  <title>Yapper — Connect</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: grid; place-items: center; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: radial-gradient(900px 500px at 10% -10%, rgba(0,208,135,.35), transparent 60%), #0d1311; color: #e7f3ee; }
    form { width: min(420px, calc(100vw - 32px)); background: #19221e; border: 1px solid rgba(160,255,215,.08); border-radius: 18px; padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
    img { width: 72px; display: block; margin: 0 auto 12px; }
    h1 { text-align: center; margin: 0 0 6px; font-size: 1.4rem; }
    p { text-align: center; color: #9cb1a8; margin: 0 0 20px; font-size: .9rem; }
    label { display: block; font-size: .75rem; font-weight: 700; text-transform: uppercase; color: #9cb1a8; margin-bottom: 8px; }
    input { width: 100%; height: 42px; border-radius: 8px; border: 1px solid rgba(160,255,215,.08); background: #222e29; color: #e7f3ee; padding: 0 12px; font-size: 1rem; outline: none; }
    input:focus { border-color: #00d087; }
    button { margin-top: 16px; width: 100%; height: 44px; border: 0; border-radius: 8px; background: #00d087; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; }
    button:hover { background: #00b977; }
    .err { color: #f2545b; font-size: .875rem; margin-top: 10px; min-height: 1em; }
  </style>
</head>
<body>
  <form id="f">
    <img src="build/icon.png" alt="">
    <h1>Connect to Yapper</h1>
    <p>Enter the address of your Yapper server (for example your Railway URL).</p>
    <label for="u">Server URL</label>
    <input id="u" type="url" placeholder="https://yapper.up.railway.app" required autofocus>
    <button type="submit">Connect</button>
    <div class="err" id="e"></div>
  </form>
  <script>
    const f = document.getElementById('f'), u = document.getElementById('u'), e = document.getElementById('e');
    window.yapperSetup.get().then((v) => { if (v) u.value = v; });
    f.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      e.textContent = '';
      let v = u.value.trim();
      if (v && !/^https?:\/\//.test(v)) v = 'https://' + v;
      const r = await window.yapperSetup.save(v);
      if (r && r.error) e.textContent = r.error;
    });
  </script>
</body>
</html>
